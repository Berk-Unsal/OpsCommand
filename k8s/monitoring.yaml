---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    rule_files:
      - /etc/prometheus/alerts.yml

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: opscommand-backend
        metrics_path: /metrics
        static_configs:
          - targets: ["backend-service:4000"]

      - job_name: node-exporter
        static_configs:
          - targets: ["node-exporter-service:9100"]

  alerts.yml: |
    groups:
      - name: opscommand-alerts
        rules:
          - alert: OpsCommandHighErrorRate
            expr: |
              sum(rate(opscommand_commands_total{status="error"}[5m]))
              /
              clamp_min(sum(rate(opscommand_commands_total[5m])), 0.001)
              > 0.2
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "OpsCommand command error rate is high"
              description: "More than 20% of commands have failed during the last 5 minutes."

          - alert: OpsCommandHighP95Latency
            expr: |
              histogram_quantile(0.95, sum(rate(opscommand_command_duration_seconds_bucket[5m])) by (le)) > 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "OpsCommand p95 command latency is high"
              description: "The 95th percentile command execution latency has exceeded 1 second."

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v2.55.1
        ports:
        - containerPort: 9090
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --web.console.libraries=/usr/share/prometheus/console_libraries
        - --web.console.templates=/usr/share/prometheus/consoles
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus
          readOnly: true
      volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-config

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
  - protocol: TCP
    port: 9090
    targetPort: 9090

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
data:
  prometheus-datasource.yml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-service:9090
        isDefault: true
        editable: false

  dashboards.yml: |
    apiVersion: 1

    providers:
      - name: opscommand
        orgId: 1
        folder: OpsCommand
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards

